<!--
  Tweezer Picks brand outlines.

  Derived artwork: the "T" and the "Tweezer Picks" wordmark rendered from Honk
  to vector outlines with COLRv1 colour layers resolved, so no font is needed
  to regenerate the site's icons and social card. This is the same thing as
  converting text to outlines in a drawing program.

  Honk: Copyright 2023 The Honk Project Authors
  (https://github.com/EkType/Honk), licensed under the SIL Open Font License
  1.1 (https://scripts.sil.org/OFL). The font binary itself is deliberately NOT
  vendored into this repository; only this rendered artwork is.

  Layer order is significant and must be preserved: black extrusion, then the
  gradient field (a plain rectangle), then a black path that carves the
  letterform out of that field. Painting them in any other order loses the
  letter.
-->
